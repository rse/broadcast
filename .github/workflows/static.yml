
name: Build and Publish Broadcast Application

on:
    push:
        branches: [ "master" ]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

concurrency:
    group: "publish"
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:

            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Setup Docker Build
                uses: docker/setup-buildx-action@v3

            -   name: Docker Login
                uses: docker/login-action@v3
                with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Docker Image Version
                id: image
                run: |
                    version=$(sed -n 's/^ARG[[:space:]]\{1,\}IMAGE_VERSION=\(.*\)$/\1/p' etc/broadcast.dockerfile)
                    release=$(sed -n 's/^ARG[[:space:]]\{1,\}IMAGE_RELEASE=\(.*\)$/\1/p' etc/broadcast.dockerfile)
                    test -n "$version" || { echo "ERROR: IMAGE_VERSION not found" >&2; exit 1; }
                    test -n "$release" || { echo "ERROR: IMAGE_RELEASE not found" >&2; exit 1; }
                    echo "version=$version" >> "$GITHUB_OUTPUT"
                    echo "release=$release" >> "$GITHUB_OUTPUT"

            -   name: Docker Credentials
                id: meta
                uses: docker/metadata-action@v5
                with:
                    images: ghcr.io/${{ github.repository }}
                    tags: |
                        type=raw,value=${{ steps.image.outputs.version }}
                        type=raw,value=${{ steps.image.outputs.version }}-${{ steps.image.outputs.release }}
                        type=raw,value=latest,enable={{is_default_branch}}
                        type=sha,format=long

            -   name: Docker Build and Push
                uses: docker/build-push-action@v6
                with:
                    context: .
                    file:   etc/broadcast.dockerfile
                    push:   true
                    tags:   ${{ steps.meta.outputs.tags }}
                    labels: ${{ steps.meta.outputs.labels }}
                    cache-from: type=gha
                    cache-to:   type=gha,mode=max

            -   name: Trigger Deployment Webhook
                env:
                    ARCANE_WEBHOOK_URL: ${{ secrets.ARCANE_WEBHOOK_URL }}
                run: |
                    curl --fail-with-body --silent --show-error \
                    --request POST "$ARCANE_WEBHOOK_URL" \
                    --header "Content-Type: application/json" \
                    --data "{ \"repository\": \"$GITHUB_REPOSITORY\", \"ref\": \"$GITHUB_REF\", \"sha\": \"$GITHUB_SHA\", \"run\": \"$GITHUB_RUN_ID\" }"
